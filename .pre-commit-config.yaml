# Install: uv run pre-commit install    (runs the same checks as CI, locally)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-private-data
        name: block photos, videos, databases and model artefacts
        language: fail
        entry: "Real data must never be committed (images, videos, DBs, embeddings, models)."
        files: '\.(jpe?g|png|webp|mp4|mov|mkv|avi|webm|db|sqlite3?|npy|npz|joblib|pkl|pt|pth|safetensors|onnx)$'
        exclude: '^app/web/static/'
